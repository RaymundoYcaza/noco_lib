[project]
name = "tardis"
version = "0.1.0"
description = "Cliente de escritorio modular tipo Outlook/Thunderbird (Tardis)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "PySide6-QtAds",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "typer>=0.12",
    "questionary>=2.0",
    "qtawesome>=1.3.0",
]

[project.scripts]
tardis = "app_core.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app_core*", "noco_lib*", "modules*", "shared*"]

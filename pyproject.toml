[project]
name = "noco_lib"
version = "0.1.0"
description = "Capa de abstracción solida sobre la API v2 de NocoDB"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "typer>=0.12",
    "questionary>=2.0",
]

[project.scripts]
noco = "noco_cli.main:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["noco_core*", "noco_discovery*", "noco_ext*", "noco_modules*", "noco_cli*"]
